<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register · VetCare Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e0f2f1 0%, #b2dfdb 100%);
            min-height: 100vh;
        }
        
        .navbar {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%) !important;
            padding: 1rem 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        
        .navbar-brand {
            font-size: 28px !important;
            font-weight: 800 !important;
            color: white !important;
            letter-spacing: -0.5px;
        }
        
        .navbar-brand span {
            color: #10b981;
        }
        
        .nav-link {
            color: rgba(255,255,255,0.9) !important;
            font-weight: 600;
            margin: 0 5px;
            padding: 8px 16px !important;
            border-radius: 8px;
        }
        
        .nav-link:hover {
            background: rgba(16, 185, 129, 0.2);
            color: white !important;
        }
        
        .btn-account {
            border: 2px solid rgba(255,255,255,0.2);
            color: white !important;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .auth-page {
            min-height: calc(100vh - 76px);
            display: flex;
            align-items: center;
            padding: 40px 0;
        }
        
        .auth-card {
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }
        
        .brand {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .brand-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 40px;
            color: white;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
        }
        
        .brand h1 {
            font-size: 28px;
            font-weight: 800;
            color: #059669;
        }
        
        .brand p {
            color: #64748b;
            font-size: 14px;
        }
        
        .auth-tabs {
            display: flex;
            border-bottom: 2px solid #eef2f6;
            margin-bottom: 25px;
        }
        
        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 15px 0;
            font-weight: 700;
            font-size: 16px;
            color: #64748b;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: all 0.3s;
        }
        
        .auth-tab.active {
            color: #10b981;
            border-bottom: 3px solid #10b981;
        }
        
        .auth-tab i {
            margin-right: 8px;
        }
        
        .form-control {
            border-radius: 12px;
            padding: 12px 18px;
            border: 2px solid #e2e8f0;
            font-size: 15px;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }
        
        .form-label {
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
        }
        
        .password-wrapper {
            position: relative;
        }
        
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #64748b;
            z-index: 10;
        }
        
        .password-toggle:hover {
            color: #10b981;
        }
        
        .btn-auth {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            font-weight: 700;
            padding: 14px;
            border-radius: 50px;
            width: 100%;
            border: none;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .btn-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
            color: white;
        }
        
        .auth-footer {
            text-align: center;
            margin-top: 25px;
            color: #64748b;
        }
        
        .auth-footer a {
            color: #10b981;
            font-weight: 700;
            text-decoration: none;
        }
        
        .auth-footer a:hover {
            text-decoration: underline;
        }
        
        .validation-feedback {
            font-size: 12px;
            margin-top: 5px;
        }
        
        .validation-feedback small {
            display: block;
            margin-bottom: 2px;
        }
        
        .password-strength {
            height: 4px;
            border-radius: 2px;
            background: #e2e8f0;
            margin-top: 8px;
            overflow: hidden;
        }
        
        .strength-bar {
            height: 100%;
            width: 0;
            transition: all 0.3s;
        }
        
        .strength-bar.weak { width: 25%; background: #dc3545; }
        .strength-bar.medium { width: 50%; background: #ffc107; }
        .strength-bar.strong { width: 75%; background: #28a745; }
        .strength-bar.very-strong { width: 100%; background: #20c997; }
    </style>
</head>
<body>

<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">
            <span>Vet</span>Care Pro
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="services.html">Services</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Auth Section -->
<div class="auth-page">
    <div class="container">
        <div class="auth-card">
            <div class="brand">
                <div class="brand-icon">
                    <i class="fas fa-paw"></i>
                </div>
                <h1>VetCare Pro</h1>
                <p>Veterinary Clinic Management System</p>
            </div>
            
            <div class="auth-tabs">
                <div class="auth-tab active" id="loginTabBtn" onclick="switchTab('login')">
                    <i class="fas fa-key"></i> Login
                </div>
                <div class="auth-tab" id="registerTabBtn" onclick="switchTab('register')">
                    <i class="fas fa-user-plus"></i> Sign Up
                </div>
            </div>

            <!-- LOGIN FORM -->
            <div id="loginForm" class="tab-pane" style="display: block;">
                <form id="loginFormElement">
                    <div class="mb-3">
                        <label class="form-label">Username or Email</label>
                        <input type="text" class="form-control" name="username" placeholder="Enter your username" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <div class="password-wrapper">
                            <input type="password" class="form-control" name="password" id="loginPassword" placeholder="••••••••" required>
                            <i class="fas fa-eye password-toggle" onclick="togglePassword('loginPassword')"></i>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-auth">
                        <i class="fas fa-sign-in-alt me-2"></i> Log In
                    </button>
                </form>
                <div class="auth-footer">
                    New here? <a href="#" onclick="switchTab('register'); return false;">Create an account</a>
                </div>
            </div>

            <!-- REGISTER FORM -->
            <div id="registerForm" class="tab-pane" style="display: none;">
                <form id="registerFormElement">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control" name="firstName" placeholder="John" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control" name="lastName" placeholder="Doe" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" placeholder="you@email.com" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" name="username" placeholder="johndoe" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <div class="password-wrapper">
                            <input type="password" class="form-control" name="password" id="regPassword" placeholder="Create a password" required>
                            <i class="fas fa-eye password-toggle" onclick="togglePassword('regPassword')"></i>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label">Confirm Password</label>
                        <div class="password-wrapper">
                            <input type="password" class="form-control" name="confirmPassword" id="regConfirmPassword" placeholder="Re-enter password" required>
                            <i class="fas fa-eye password-toggle" onclick="togglePassword('regConfirmPassword')"></i>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-auth">
                        <i class="fas fa-user-plus me-2"></i> Create Account
                    </button>
                </form>
                <div class="auth-footer">
                    Already have an account? <a href="#" onclick="switchTab('login'); return false;">Sign in</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<script>
    const SUPABASE_URL = 'https://aozhkwvoqnyktsgrdtnw.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFvemhrd3ZvcW55a3RzZ3JkdG53Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3MjU2NTA1NiwiZXhwIjoyMDg4MTQxMDU2fQ.lbr0-PCymnj241Vwso6yJYzch7HOJ5utB-pPsWpkABc';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    function togglePassword(inputId) {
        const input = document.getElementById(inputId);
        const icon = input.nextElementSibling;
        
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
    
    function switchTab(tab) {
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const loginTab = document.getElementById('loginTabBtn');
        const registerTab = document.getElementById('registerTabBtn');
        
        if (tab === 'login') {
            loginForm.style.display = 'block';
            registerForm.style.display = 'none';
            loginTab.classList.add('active');
            registerTab.classList.remove('active');
        } else {
            loginForm.style.display = 'none';
            registerForm.style.display = 'block';
            registerTab.classList.add('active');
            loginTab.classList.remove('active');
        }
    }
    
    async function handleLogin(event) {
        event.preventDefault();
        
        const form = event.target;
        const username = form.username.value;
        const password = form.password.value;
        
        try {
            const response = await fetch(
                `${SUPABASE_URL}/rest/v1/users?or=(username.eq.${username},email.eq.${username})`,
                {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                }
            );
            
            const users = await response.json();
            
            if (users.length > 0) {
                if (users[0].password === password) {
                    alert('✅ Login successful!');
                    
                    sessionStorage.setItem('userId', users[0].user_id);
                    sessionStorage.setItem('username', users[0].username);
                    sessionStorage.setItem('role', users[0].role || 'client');
                    
                    window.location.href = 'index.html';
                } else {
                    alert('❌ Invalid password');
                }
            } else {
                alert('❌ User not found');
            }
        } catch (error) {
            alert('❌ Error: ' + error.message);
        }
    }
    
    async function handleRegister(event) {
        event.preventDefault();
        
        const form = event.target;
        const password = form.password.value;
        const confirmPassword = form.confirmPassword.value;
        
        if (password !== confirmPassword) {
            alert('❌ Passwords do not match!');
            return;
        }
        
        const userData = {
            username: form.username.value,
            email: form.email.value,
            password: password,
            first_name: form.firstName.value,
            last_name: form.lastName.value,
            role: 'client'
        };
        
        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/users`, {
                method: 'POST',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify(userData)
            });
            
            if (response.ok) {
                alert('✅ Registration successful! Please login.');
                switchTab('login');
                form.reset();
            } else {
                const error = await response.json();
                alert('❌ Registration failed: ' + (error.message || 'Unknown error'));
            }
        } catch (error) {
            alert('❌ Error: ' + error.message);
        }
    }
    
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const tab = urlParams.get('tab');
        
        if (tab === 'register') {
            switchTab('register');
        } else {
            switchTab('login');
        }
        
        document.getElementById('loginFormElement').onsubmit = handleLogin;
        document.getElementById('registerFormElement').onsubmit = handleRegister;
    };
</script>

</body>
</html>
